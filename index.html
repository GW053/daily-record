<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日常记录</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f1ea;
      --surface: #fffaf5;
      --surface-strong: #fffdf9;
      --ink: #2f2924;
      --muted: #7b695d;
      --line: #ecd9cc;
      --accent: #b65a2b;
      --accent-strong: #8f4324;
      --accent-soft: #f5dfd0;
      --good: #557a58;
      --good-soft: #e6efe3;
      --improve: #bd6436;
      --improve-soft: #f6e2d5;
      --lucky: #a67718;
      --lucky-soft: #f4ebcf;
      --sleep-main: #b65a2b;
      --sleep-line: #7f604f;
      --sleep-soft: #d8cbc1;
      --sleep-softer: #eadfd6;
      --shadow: 0 10px 26px rgba(102, 68, 42, 0.09);
      --radius: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      overflow-x: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      width: min(100%, 480px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 14px calc(88px + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      color: #fff;
      background: var(--accent);
      border-radius: 8px;
      box-shadow: 0 8px 18px rgba(182, 90, 43, 0.22);
    }

    .brand-mark svg {
      width: 21px;
      height: 21px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      overflow: hidden;
      font-size: 22px;
      line-height: 1.18;
      text-overflow: ellipsis;
      white-space: nowrap;
      letter-spacing: 0;
    }

    .page-date {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
      min-width: 42px;
    }

    .save-state {
      min-width: 42px;
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .icon-button {
      display: inline-grid;
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      place-items: center;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .icon-button:active {
      transform: scale(0.96);
    }

    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: rgba(182, 90, 43, 0.48);
      outline: none;
    }

    .icon-button svg {
      width: 19px;
      height: 19px;
      stroke-width: 2;
    }

    .screen {
      display: none;
      gap: 12px;
      min-width: 0;
    }

    .screen.is-active {
      display: grid;
    }

    .panel {
      min-width: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .date-strip {
      display: grid;
      grid-template-columns: auto 38px minmax(0, 1fr) 38px 38px;
      gap: 8px;
      align-items: center;
      padding: 12px 14px;
    }

    .inline-label {
      min-width: 0;
    }

    .field-label,
    .inline-label,
    .note-title {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
      font-weight: 700;
    }

    .date-picker-control {
      position: relative;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: var(--ink);
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.16s ease, background 0.16s ease;
    }

    .date-picker-control:hover,
    .date-picker-control:focus-within {
      border-color: rgba(182, 90, 43, 0.48);
    }

    .date-picker-control svg {
      width: 19px;
      height: 19px;
      stroke-width: 2;
    }

    .date-picker-control input {
      position: absolute;
      inset: 0;
      width: 100%;
      min-height: 0;
      height: 100%;
      padding: 0;
      color: transparent;
      background: transparent;
      border: 0;
      opacity: 0;
      cursor: pointer;
    }

    .date-display {
      height: 38px;
      min-height: 38px;
      padding: 0 10px;
      font-size: 14px;
      text-align: center;
    }

    .date-display,
    .duration-input,
    input[type="date"],
    input[type="time"],
    input[type="number"],
    textarea {
      width: 100%;
      color: var(--ink);
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .date-display:focus,
    .duration-input:focus,
    input[type="date"]:focus,
    input[type="time"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      background: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(182, 90, 43, 0.14);
    }

    input[type="date"] {
      min-height: 42px;
      padding: 0 11px;
    }

    input[type="time"] {
      min-height: 42px;
      padding: 0 11px;
    }

    .duration-input {
      min-height: 42px;
      padding: 0 11px;
      font-weight: 700;
      text-align: center;
    }

    .date-picker-control input[type="date"] {
      min-height: 0;
      height: 100%;
      padding: 0;
      color: transparent;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .score-panel {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(112px, 150px);
      gap: 12px;
      align-items: center;
      padding: 14px;
    }

    .score-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .score-row input {
      height: 44px;
      padding: 0 10px;
      font-size: 22px;
      line-height: 1;
      text-align: center;
      appearance: textfield;
    }

    .score-row input::-webkit-outer-spin-button,
    .score-row input::-webkit-inner-spin-button {
      margin: 0;
      appearance: none;
    }

    .score-row span {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .notes-panel {
      display: grid;
      gap: 14px;
      padding: 14px;
    }

    .sleep-panel,
    .sleep-chart-panel {
      display: grid;
      gap: 14px;
      padding: 14px;
    }

    .sleep-time-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .time-field {
      display: grid;
      gap: 7px;
      min-width: 0;
    }

    .time-field span,
    .total-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    .sleep-total-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(112px, 150px);
      gap: 12px;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .total-value {
      display: grid;
      min-height: 42px;
      place-items: center;
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-radius: 8px;
      font-weight: 700;
    }

    .section-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      min-width: 0;
    }

    .chart-options {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .chart-options label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
    }

    .chart-options input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
    }

    .section-title,
    .calendar-title,
    .detail-title {
      font-size: 16px;
      line-height: 1.3;
      font-weight: 700;
      letter-spacing: 0;
    }

    .note-block {
      display: grid;
      gap: 7px;
    }

    .note-block + .note-block {
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .note-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .note-icon {
      display: inline-grid;
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      place-items: center;
      color: currentColor;
      border-radius: 8px;
    }

    .note-icon svg {
      width: 15px;
      height: 15px;
      stroke-width: 2.2;
    }

    .note-good .note-title,
    .detail-good h3 {
      color: var(--good);
    }

    .note-improve .note-title,
    .detail-improve h3 {
      color: var(--improve);
    }

    .note-lucky .note-title,
    .detail-lucky h3 {
      color: var(--lucky);
    }

    .note-good .note-icon {
      background: var(--good-soft);
    }

    .note-improve .note-icon {
      background: var(--improve-soft);
    }

    .note-lucky .note-icon {
      background: var(--lucky-soft);
    }

    textarea {
      min-height: 132px;
      padding: 12px;
      line-height: 1.55;
      resize: vertical;
    }

    .chart-panel {
      padding: 14px 12px 12px;
    }

    .section-head,
    .detail-head,
    .calendar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .range-text,
    .score-badge {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      min-height: 210px;
      margin-top: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-strong);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 210px;
    }

    .sleep-timeline-chart {
      height: 320px;
    }

    .sleep-metric-chart {
      height: 240px;
    }

    .chart-empty {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    .chart-empty.is-visible {
      display: grid;
    }

    .metric-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr)) minmax(72px, 0.85fr);
      grid-template-rows: repeat(2, minmax(34px, auto));
      gap: 6px;
    }

    .metric-tab {
      min-height: 34px;
      color: var(--muted);
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .metric-tab.is-active {
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-color: var(--accent-soft);
    }

    .metric-tab[data-sleep-metric="sleep"] {
      grid-column: 1;
      grid-row: 1;
    }

    .metric-tab[data-sleep-metric="wake"] {
      grid-column: 2;
      grid-row: 1;
    }

    .metric-tab[data-sleep-metric="bed"] {
      grid-column: 1;
      grid-row: 2;
    }

    .metric-tab[data-sleep-metric="rise"] {
      grid-column: 2;
      grid-row: 2;
    }

    .metric-tab[data-sleep-metric="total"] {
      grid-column: 3;
      grid-row: 1 / 3;
      min-height: 74px;
    }

    .backup-button {
      display: inline-grid;
    }

    .sync-button.is-signed-in {
      color: var(--accent-strong);
      background: var(--accent-soft);
      border-color: var(--accent-soft);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px 12px;
      background: rgba(47, 41, 36, 0.34);
    }

    .modal-backdrop.is-visible {
      display: flex;
    }

    .backup-modal {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: min(100%, 920px);
      max-height: min(76vh, 520px);
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(47, 41, 36, 0.22);
    }

    .auth-modal {
      width: min(100%, 420px);
      max-height: min(86vh, 520px);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }

    .modal-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
    }

    .backup-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      min-height: 0;
      padding: 14px;
      overflow: auto;
    }

    .backup-column {
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 8px;
      min-width: 0;
      min-height: 0;
    }

    .backup-column h3 {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }

    .backup-column textarea {
      min-height: 68px;
      height: 68px;
      resize: none;
    }

    .backup-import-box {
      display: grid;
      min-height: 68px;
      height: 68px;
      align-content: center;
      gap: 10px;
      padding: 12px;
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      line-height: 1.45;
    }

    .backup-file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .backup-status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .auth-body {
      display: grid;
      gap: 12px;
      min-height: 0;
      padding: 14px;
      overflow: auto;
    }

    .auth-current {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      word-break: break-word;
    }

    .auth-fields {
      display: grid;
      gap: 8px;
    }

    .auth-fields input {
      min-height: 42px;
      padding: 0 11px;
    }

    .auth-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .action-button {
      min-height: 40px;
      color: var(--ink);
      background: var(--surface-strong);
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .action-button.primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .action-button:active {
      transform: scale(0.98);
    }

    .action-button:disabled {
      color: var(--muted);
      background: var(--surface);
      cursor: default;
      opacity: 0.62;
    }

    .auth-status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    @media (max-width: 620px) {
      .backup-grid {
        grid-template-columns: 1fr;
      }

      .backup-modal {
        max-height: 90vh;
      }
    }

    .calendar-panel {
      padding: 12px;
    }

    .calendar-top {
      min-height: 40px;
      margin-bottom: 10px;
    }

    .calendar-title {
      flex: 1 1 auto;
      text-align: center;
    }

    .weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }

    .weekdays {
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .day-cell {
      position: relative;
      display: grid;
      width: 100%;
      aspect-ratio: 1 / 1;
      place-items: center;
      color: var(--ink);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
    }

    .day-cell:focus-visible {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(182, 90, 43, 0.14);
    }

    .day-cell.is-today {
      border-color: rgba(182, 90, 43, 0.36);
    }

    .day-cell.is-selected {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .day-cell.has-entry::after {
      position: absolute;
      right: 7px;
      bottom: 6px;
      width: 5px;
      height: 5px;
      content: "";
      background: var(--lucky);
      border-radius: 50%;
    }

    .day-cell.is-selected.has-entry::after {
      background: #fff;
    }

    .day-blank {
      aspect-ratio: 1 / 1;
    }

    .day-detail {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .detail-date {
      min-width: 0;
      font-size: 16px;
      line-height: 1.3;
      word-break: keep-all;
    }

    .score-badge {
      padding: 5px 8px;
      background: var(--accent-soft);
      border-radius: 999px;
      color: var(--accent-strong);
      white-space: nowrap;
    }

    .detail-block {
      display: grid;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .detail-block h3 {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
      font-weight: 700;
    }

    .detail-block.detail-good h3 {
      color: var(--good);
    }

    .detail-block.detail-improve h3 {
      color: var(--improve);
    }

    .detail-block.detail-lucky h3 {
      color: var(--lucky);
    }

    .detail-block p {
      min-height: 24px;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty-text {
      color: var(--muted) !important;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      width: min(100%, 480px);
      max-width: 100%;
      margin: 0 auto;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: var(--surface);
      border-top: 1px solid var(--line);
      transform: translateX(-50%);
    }

    .nav-button {
      display: grid;
      gap: 3px;
      place-items: center;
      min-height: 54px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .nav-button svg {
      width: 21px;
      height: 21px;
      stroke-width: 2;
    }

    .nav-button span {
      font-size: 12px;
      line-height: 1.2;
    }

    .nav-button.is-active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    @media (min-width: 700px) {
      .app-shell {
        padding-top: 24px;
      }

      .bottom-nav {
        border-right: 1px solid var(--line);
        border-left: 1px solid var(--line);
        border-radius: 12px 12px 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 2v4"></path>
            <path d="M16 2v4"></path>
            <path d="M3 10h18"></path>
            <path d="M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"></path>
            <path d="m8 15 2 2 5-6"></path>
          </svg>
        </div>
        <div>

      els.historyScreen.classList.toggle("is-active", tab === "history");

      syncDateInputs(selectedDate);

    function commitDateText() {

      if (!nextDate) {
        syncDateInputs(selectedDate);
        return;
      }
      selectedDate = nextDate;
      selectedHistoryDate = nextDate;
      monthCursor = firstOfMonth(parseDateKey(nextDate));
      syncDateInputs(nextDate);
      loadForm(nextDate);
      renderAll();
    }

    function syncDateInputs(key) {
      els.entryDate.value = key;
      els.entryDateText.value = key;
    }

    function shiftSleepDate(days) {
      selectedSleepDate = dateKey(addDays(parseDateKey(selectedSleepDate), days));
      syncSleepDateInputs(selectedSleepDate);
      loadSleepForm(selectedSleepDate);
      renderAll();
    }

    function commitSleepDateText() {
      const nextDate = normalizeDateKey(els.sleepDateText.value);
      if (!nextDate) {
        syncSleepDateInputs(selectedSleepDate);
        return;
      }
      selectedSleepDate = nextDate;
      syncSleepDateInputs(nextDate);
      loadSleepForm(nextDate);
      renderAll();

    function syncSleepDateInputs(key) {

      els.sleepDateText.value = key;
    }

    function loadSleepForm(key) {
      const entry = state.sleepEntries[key] || {};
      els.bedTimeInput.value = entry.bed || "";
      els.sleepTimeInput.value = entry.sleep || "";
      els.wakeTimeInput.value = entry.wake || "";
      els.riseTimeInput.value = entry.rise || "";
      renderSleepTotal(entry);
      els.saveState.textContent = "";
    }

    function saveSleepEntry() {
      const key = selectedSleepDate;
      const existing = state.sleepEntries[key] || {};
      const entry = {
        bed: els.bedTimeInput.value,
        sleep: els.sleepTimeInput.value,
        wake: els.wakeTimeInput.value,
        rise: els.riseTimeInput.value,
        totalOverride: typeof existing.totalOverride === "number" ? existing.totalOverride : null,
        updatedAt: new Date().toISOString()
      };

      if (!entry.bed && !entry.sleep && !entry.wake && !entry.rise && entry.totalOverride === null) {
        delete state.sleepEntries[key];
      } else {
        state.sleepEntries[key] = entry;
      }

      persistState();
      renderSleepTotal(entry);
      showSaved();
      renderSleepCharts();
    }

    function saveSleepTotalOverride() {
      const key = selectedSleepDate;
      const entry = state.sleepEntries[key] || {
        bed: els.bedTimeInput.value,
        sleep: els.sleepTimeInput.value,
        wake: els.wakeTimeInput.value,
        rise: els.riseTimeInput.value
      };
      const trimmed = els.sleepTotalInput.value.trim();
      if (!trimmed) {
        delete entry.totalOverride;
      } else {
        const parsed = parseDurationInput(trimmed);
        if (parsed === null) {
          renderSleepTotal(entry);
          return;
        }
        entry.totalOverride = parsed;
      }
      entry.bed = els.bedTimeInput.value;
      entry.sleep = els.sleepTimeInput.value;
      entry.wake = els.wakeTimeInput.value;
      entry.rise = els.riseTimeInput.value;
      entry.updatedAt = new Date().toISOString();

      if (!entry.bed && !entry.sleep && !entry.wake && !entry.rise && typeof entry.totalOverride !== "number") {
        delete state.sleepEntries[key];
      } else {
        state.sleepEntries[key] = entry;
      }

      persistState();
      renderSleepTotal(entry);
      showSaved();
      renderSleepCharts();
    }

    function renderSleepTotal(entry = null) {
      const sleepEntry = entry || {
        bed: els.bedTimeInput.value,
        sleep: els.sleepTimeInput.value,
        wake: els.wakeTimeInput.value,
        rise: els.riseTimeInput.value
      };
      const timeline = buildSleepTimeline(sleepEntry);
      const totalMinutes = effectiveSleepTotal(sleepEntry, timeline);
      els.sleepTotalInput.value = totalMinutes !== null ? formatDuration(totalMinutes) : "";
      els.sleepTotalInput.placeholder = timeline?.computedTotal !== null && timeline?.computedTotal !== undefined
        ? `自动 ${formatDuration(timeline.computedTotal)}`
        : "未计算";
    }

    function loadForm(key) {
      const entry = state.entries[key] || {};
      els.scoreInput.value = entry.score ?? "";
      els.goodText.value = entry.good || "";
      els.improveText.value = entry.improve || "";
      els.luckyText.value = entry.lucky || "";
      els.saveState.textContent = "";
    }

    function saveCurrentEntry() {
      const key = els.entryDate.value || selectedDate;
      selectedDate = key;
      const entry = {
        score: normalizeScore(els.scoreInput.value),
        good: els.goodText.value,
        improve: els.improveText.value,
        lucky: els.luckyText.value,
        updatedAt: new Date().toISOString()
      };

      if (
        entry.score === null &&
        !entry.good.trim() &&
        !entry.improve.trim() &&
        !entry.lucky.trim()
      ) {
        delete state.entries[key];
      } else {
        state.entries[key] = entry;
      }

      persistState();
      showSaved();
      renderAll();
    }

    function showSaved() {
      els.saveState.textContent = "已保存";
      window.clearTimeout(saveTimer);
      saveTimer = window.setTimeout(() => {
        els.saveState.textContent = "";
      }, 1200);
    }

    function initSupabase() {
      updateAuthUi();
      if (!window.supabase?.createClient) {
        setAuthStatus("Supabase 客户端未加载，请检查网络后刷新页面。");
        return;
      }

      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      supabaseClient.auth.getSession()
        .then(({ data, error }) => {
          if (error) {
            setAuthStatus(`读取登录状态失败：${formatSyncError(error)}`);
            return;
          }
          handleAuthSession(data.session);
        })
        .catch((error) => {
          setAuthStatus(`读取登录状态失败：${formatSyncError(error)}`);
        });

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        handleAuthSession(session);
      });
    }

    function handleAuthSession(session) {
      const nextUser = session?.user || null;
      const userChanged = nextUser?.id !== currentUser?.id;
      currentUser = nextUser;
      updateAuthUi();
      if (currentUser && userChanged) {
        syncFromCloud();
      }
    }

    function updateAuthUi() {
      const signedIn = Boolean(currentUser);
      els.syncButton.classList.toggle("is-signed-in", signedIn);
      els.authUserText.textContent = signedIn
        ? `已登录：${currentUser.email || currentUser.id}`
        : "未登录，登录后会自动云同步。";
      els.authLogoutButton.disabled = !signedIn;
      els.authSyncButton.disabled = !signedIn;
    }

    function openAuthModal() {
      updateAuthUi();
      els.authStatus.textContent = !supabaseClient
        ? "Supabase 还没有连接成功，请检查网络后刷新。"
        : currentUser
          ? "自动云同步已开启。"
          : "登录或注册后，会自动合并云端和本地记录。";
      els.authModal.classList.add("is-visible");
      els.authModal.setAttribute("aria-hidden", "false");
    }

    function closeAuthModal() {
      els.authModal.classList.remove("is-visible");
      els.authModal.setAttribute("aria-hidden", "true");
    }

    function setAuthStatus(message) {
      els.authStatus.textContent = message;
    }

    function authCredentials() {
      const email = els.authEmail.value.trim();
      const password = els.authPassword.value;
      if (!email || !password) {
        setAuthStatus("请输入邮箱和密码。");
        return null;
      }
      return { email, password };
    }

    function authRedirectTo() {
      const url = window.location.href.split("#")[0];
      return /^https?:\/\//.test(url) ? url : undefined;
    }

    async function signInWithEmail() {
      if (!ensureSupabaseClient()) {
        return;
      }
      const credentials = authCredentials();
      if (!credentials) {
        return;
      }
      setAuthStatus("正在登录...");
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword(credentials);
        if (error) {
          setAuthStatus(`登录失败：${formatSyncError(error)}`);
          return;
        }
        if (data.session) {
          handleAuthSession(data.session);
        }
        setAuthStatus("登录成功，正在同步...");
      } catch (error) {
        setAuthStatus(`登录失败：${formatSyncError(error)}`);
      }
    }

    async function signUpWithEmail() {
      if (!ensureSupabaseClient()) {
        return;
      }
      const credentials = authCredentials();
      if (!credentials) {
        return;
      }
      setAuthStatus("正在注册...");
      const redirectTo = authRedirectTo();
      const signUpPayload = redirectTo
        ? { ...credentials, options: { emailRedirectTo: redirectTo } }
        : credentials;
      try {
        const { data, error } = await supabaseClient.auth.signUp(signUpPayload);
        if (error) {
          setAuthStatus(`注册失败：${formatSyncError(error)}`);
          return;
        }
        if (data.session) {
          handleAuthSession(data.session);
          setAuthStatus("注册成功，正在同步...");
        } else {
          setAuthStatus("注册成功，请按邮件提示确认后再登录。");
        }
      } catch (error) {
        setAuthStatus(`注册失败：${formatSyncError(error)}`);
      }
    }

    async function signOutUser() {
      if (!ensureSupabaseClient()) {
        return;
      }
      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) {
          setAuthStatus(`退出失败：${formatSyncError(error)}`);
          return;
        }
      } catch (error) {
        setAuthStatus(`退出失败：${formatSyncError(error)}`);
        return;
      }
      currentUser = null;
      updateAuthUi();
      setAuthStatus("已退出登录，本地记录仍会保留。");
    }

    function ensureSupabaseClient() {
      if (supabaseClient) {
        return true;
      }
      setAuthStatus("Supabase 还没有连接成功，请检查网络后刷新。");
      return false;
    }

    function syncCloudNow() {
      if (!ensureSupabaseClient() || !currentUser) {
        setAuthStatus("请先登录后再同步。");
        return;
      }
      syncFromCloud(true);
    }

    function scheduleCloudSync(delay = 900) {
      if (!supabaseClient || !currentUser) {
        return;
      }
      if (cloudSyncing) {
        cloudSyncPending = true;
        return;
      }
      window.clearTimeout(cloudSyncTimer);
      cloudSyncTimer = window.setTimeout(() => {
        uploadCloudState();
      }, delay);
    }

    async function syncFromCloud(manual = false) {
      if (!supabaseClient || !currentUser) {
        return;
      }
      if (cloudSyncing) {
        cloudSyncPending = true;
        return;
      }

      cloudSyncing = true;
      setAuthStatus(manual ? "正在手动同步..." : "正在同步云端数据...");
      try {
        const { data, error } = await supabaseClient
          .from(SYNC_TABLE)
          .select("data")
          .eq("user_id", currentUser.id)
          .limit(1);

        if (error) {
          throw error;
        }

        const cloudPayload = data?.[0]?.data || null;
        let result = null;
        if (hasBackupRecords(cloudPayload)) {
          const mergeResult = mergeBackup(cloudPayload);
          if (mergeResult.ok) {
            result = mergeResult;
            persistState({ sync: false });
            loadForm(selectedDate);
            loadSleepForm(selectedSleepDate);
            renderAll();
            if (els.backupModal.classList.contains("is-visible")) {
              refreshBackupText();
            }
          }
        }

        await writeCloudState();
        const mergedText = result ? `，已合并 ${result.added + result.merged} 天云端记录` : "";
        setAuthStatus(`已同步到云端${mergedText}。`);
      } catch (error) {
        setAuthStatus(`同步失败：${formatSyncError(error)}`);
      } finally {
        cloudSyncing = false;
        if (cloudSyncPending) {
          cloudSyncPending = false;
          scheduleCloudSync(300);
        }
      }
    }

    async function uploadCloudState() {
      if (!supabaseClient || !currentUser) {
        return;
      }
      if (cloudSyncing) {
        cloudSyncPending = true;
        return;
      }
      cloudSyncing = true;
      try {
        await writeCloudState();
        setAuthStatus("已自动同步到云端。");
      } catch (error) {
        setAuthStatus(`自动同步失败：${formatSyncError(error)}`);
      } finally {
        cloudSyncing = false;
        if (cloudSyncPending) {
          cloudSyncPending = false;
          scheduleCloudSync(300);
        }
      }
    }

    async function writeCloudState() {
      const payload = backupPayload();
      const { error } = await supabaseClient
        .from(SYNC_TABLE)
        .upsert({
          user_id: currentUser.id,
          data: payload,
          updated_at: payload.exportedAt
        }, { onConflict: "user_id" });

      if (error) {
        throw error;
      }
    }

    function hasBackupRecords(payload) {
      if (!payload || typeof payload !== "object") {
        return false;
      }
      const entryCount = Object.keys(payload.entries || {}).length;
      const sleepCount = Object.keys(payload.sleepEntries || {}).length;
      return entryCount > 0 || sleepCount > 0;
    }

    function formatSyncError(error) {
      const message = error?.message || String(error || "未知错误");
      const details = [
        message,
        error?.status ? `状态码：${error.status}` : "",
        error?.code ? `错误码：${error.code}` : ""
      ].filter(Boolean);
      const normalized = message.toLowerCase();
      let hint = "";
      if (message.includes(SYNC_TABLE) || message.includes("does not exist")) {
        hint = `请先在 Supabase 创建 ${SYNC_TABLE} 表并开启 RLS。`;
      } else if (normalized.includes("invalid api key") || normalized.includes("api key")) {
        hint = "请检查 Project URL 和 Publishable key 是否来自同一个 Supabase 项目。";
      } else if (normalized.includes("failed to fetch") || normalized.includes("networkerror")) {
        hint = "请用已部署的 https 网站地址测试，并检查网络是否能访问 Supabase 和 jsDelivr。";
      } else if (normalized.includes("signup") && (normalized.includes("disabled") || normalized.includes("not allowed"))) {
        hint = "请在 Authentication > Providers > Email 中允许新用户注册。";
      } else if (normalized.includes("password")) {
        hint = "请确认密码长度和复杂度符合 Supabase 的要求，通常至少 6 位。";
      } else if (normalized.includes("already") || normalized.includes("registered")) {
        hint = "这个邮箱可能已经注册过，请直接登录或换一个邮箱。";
      } else if (normalized.includes("rate limit")) {
        hint = "触发了邮件或注册频率限制，请稍后再试。";
      } else if (normalized.includes("captcha")) {
        hint = "如果开启了 Bot/Captcha 防护，需要关闭它或在前端接入验证码 token。";
      } else if (normalized.includes("redirect")) {
        hint = "请检查 Authentication > URL Configuration 里的 Site URL 和 Redirect URLs。";
      }
      return hint ? `${details.join("\n")}\n${hint}` : details.join("\n");
    }

    function queueDrawChart() {
      if (chartFrame) {
        return;
      }
      chartFrame = window.requestAnimationFrame(() => {
        chartFrame = 0;

    function drawChart() {
      const canvas = els.chart;
      const prepared = prepareCanvas(canvas, 210);
      if (!prepared) {
        return;
      }
      const { ctx, width, height } = prepared;
      ctx.clearRect(0, 0, width, height);
      const lineColor = cssVar("--line");
      const mutedColor = cssVar("--muted");
      const accentColor = cssVar("--accent");
      const pointFill = cssVar("--surface-strong");

      const keys = JSON.parse(canvas.dataset.days || "[]");
      const values = keys.map((key) => {
        const score = state.entries[key]?.score;
        return typeof score === "number" ? score : null;
      });
      const hasValue = values.some((value) => value !== null);
      els.chartEmpty.classList.toggle("is-visible", !hasValue);

      const pad = { top: 18, right: 20, bottom: 38, left: 34 };
      const plotWidth = width - pad.left - pad.right;
      const plotHeight = height - pad.top - pad.bottom;
      const xFor = (index) => pad.left + (plotWidth * index) / 6;
      const yFor = (value) => pad.top + plotHeight - (plotHeight * value) / 100;

      ctx.lineWidth = 1;
      ctx.strokeStyle = lineColor;
      ctx.fillStyle = mutedColor;
      ctx.font = "12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";

      [0, 25, 50, 75, 100].forEach((tick) => {
        const y = yFor(tick);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
        ctx.fillText(String(tick), pad.left - 7, y);
      });

      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      keys.forEach((key, index) => {
        const x = xFor(index);
        const label = key.slice(5).replace("-", "/");
        ctx.fillText(label, x, height - pad.bottom + 14);
      });

      if (!hasValue) {
        return;
      }

      ctx.lineWidth = 3;
      ctx.strokeStyle = accentColor;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      let drawing = false;
      values.forEach((value, index) => {
        if (value === null) {
          if (drawing) {
            ctx.stroke();
          }
          drawing = false;
          return;
        }
        const x = xFor(index);
        const y = yFor(value);
        if (!drawing) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          drawing = true;
        } else {
          ctx.lineTo(x, y);
        }
      });
      if (drawing) {
        ctx.stroke();
      }

      values.forEach((value, index) => {
        if (value === null) {
          return;
        }
        const x = xFor(index);
        const y = yFor(value);
        ctx.beginPath();
        ctx.fillStyle = pointFill;
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 3;
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        if (els.scoreLabelsToggle.checked) {
          drawScoreLabel(ctx, `${value}分`, x, y, index, width, pad);
        }
      });
    }

    function drawScoreLabel(ctx, label, x, y, index, width, pad) {
      ctx.save();
      ctx.fillStyle = cssVar("--muted");
      ctx.font = "11px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.textAlign = x > width - pad.right - 24 ? "right" : x < pad.left + 24 ? "left" : "center";
      const placeBelow = y < pad.top + 18;
      ctx.textBaseline = placeBelow ? "top" : "bottom";
      const offsetY = placeBelow ? 9 : -9;
      const stagger = index % 2 === 0 ? 0 : (placeBelow ? 5 : -5);
      ctx.fillText(label, x, y + offsetY + stagger);
      ctx.restore();
    }

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function prepareCanvas(canvas, cssHeight) {
      const wrap = canvas.parentElement;
      const width = Math.floor(wrap.clientWidth);
      if (width < 80) {
        return null;
      }
      const ratio = window.devicePixelRatio || 1;
      const pixelWidth = Math.floor(width * ratio);
      const pixelHeight = Math.floor(cssHeight * ratio);
      if (canvas.width !== pixelWidth) {
        canvas.width = pixelWidth;
      }
      if (canvas.height !== pixelHeight) {
        canvas.height = pixelHeight;
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { ctx, width, height: cssHeight, ratio };
    }

    function renderSleepCharts() {
      const keys = sleepWeekKeys();
      const rangeLabel = `${formatCompactDate(keys[0])}-${formatCompactDate(keys[6])}`;
      els.sleepRangeTitle.textContent = `近七天睡眠（${rangeLabel}）`;
      els.sleepMetricTitle.textContent = `单项变化（${rangeLabel}）`;
      els.sleepTimelineChart.dataset.keys = JSON.stringify(keys);
      els.sleepMetricChart.dataset.keys = JSON.stringify(keys);
      queueDrawSleepCharts();
    }

    function queueDrawSleepCharts() {
      if (sleepChartFrame) {
        return;
      }
      sleepChartFrame = window.requestAnimationFrame(() => {
        sleepChartFrame = 0;
        drawSleepTimelineChart();
        drawSleepMetricChart();
      });
    }

    function sleepWeekKeys() {
      const today = parseDateKey(todayKey());
      return Array.from({ length: 7 }, (_, index) => dateKey(addDays(today, index - 6)));
    }

    function sleepRows() {
      const keys = JSON.parse(els.sleepTimelineChart.dataset.keys || "[]");
      return keys.map((key) => {
        const entry = state.sleepEntries[key] || {};
        return {
          key,
          entry,
          timeline: buildSleepTimeline(entry)
        };
      });
    }

    function drawSleepTimelineChart() {
      const prepared = prepareCanvas(els.sleepTimelineChart, 320);
      if (!prepared) {
        return;
      }
      const { ctx, width, height } = prepared;
      ctx.clearRect(0, 0, width, height);

      const rows = sleepRows();
      const timelines = rows.map((row) => row.timeline).filter(Boolean);
      const points = timelines.flatMap((timeline) => [timeline.bed, timeline.sleep, timeline.wake, timeline.rise])
        .filter((value) => value !== null);
      const hasData = points.length > 0;
      els.sleepTimelineEmpty.classList.toggle("is-visible", !hasData);

      const lineColor = cssVar("--line");
      const mutedColor = cssVar("--muted");
      const accentColor = cssVar("--sleep-main");
      const prePostColor = cssVar("--sleep-softer");

      const pad = { top: 42, right: 16, bottom: 30, left: 54 };
      const plotWidth = width - pad.left - pad.right;
      const plotHeight = height - pad.top - pad.bottom;
      const rowStep = plotHeight / rows.length;
      const rowY = (index) => pad.top + rowStep * index + rowStep / 2;

      let minTime = hasData ? Math.min(...points) : 0;
      let maxTime = hasData ? Math.max(...points) : 1440;
      minTime = Math.floor((minTime - 45) / 60) * 60;
      maxTime = Math.ceil((maxTime + 45) / 60) * 60;
      if (maxTime - minTime < 360) {
        const center = (minTime + maxTime) / 2;
        minTime = Math.floor((center - 180) / 60) * 60;
        maxTime = Math.ceil((center + 180) / 60) * 60;
      }
      const xFor = (value) => pad.left + ((value - minTime) / (maxTime - minTime)) * plotWidth;
      const tickStep = maxTime - minTime > 720 ? 180 : 120;

      ctx.font = "12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillStyle = mutedColor;
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = 1;

      for (let tick = Math.ceil(minTime / tickStep) * tickStep; tick <= maxTime; tick += tickStep) {
        const x = crisp(xFor(tick));
        ctx.beginPath();
        ctx.moveTo(x, pad.top);
        ctx.lineTo(x, height - pad.bottom);
        ctx.stroke();
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillText(formatClock(tick), x, height - pad.bottom + 8);
      }

      rows.forEach((row, index) => {
        const y = rowY(index);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = mutedColor;
        ctx.fillText(formatShortDate(row.key), pad.left - 8, y);

        if (!row.timeline) {
          return;
        }

        const barHeight = 12;
        drawSegment(ctx, row.timeline.bed, row.timeline.sleep, xFor, y, barHeight, prePostColor);
        drawSegment(ctx, row.timeline.sleep, row.timeline.wake, xFor, y, barHeight + 3, accentColor);
        drawSegment(ctx, row.timeline.wake, row.timeline.rise, xFor, y, barHeight, prePostColor);
        if (els.timelineLabelsToggle.checked) {
          drawTimelineLabels(ctx, row.timeline, xFor, y);
        }
      });

      if (!hasData) {
        return;
      }

      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      drawLegend(ctx, pad.left, 18, accentColor, "睡眠");
      drawLegend(ctx, pad.left + 62, 18, prePostColor, "上床/起床缓冲");
    }

    function drawSleepMetricChart() {
      const prepared = prepareCanvas(els.sleepMetricChart, 240);
      if (!prepared) {
        return;
      }
      const { ctx, width, height } = prepared;
      ctx.clearRect(0, 0, width, height);

      const rows = sleepRows();
      const metric = activeSleepMetric;
      if (metric === "total") {
        drawSleepTotalBars(ctx, width, height, rows);
        return;
      }

      const defs = sleepMetricDefs();
      const activeDefs = defs.filter((def) => def.key === metric);
      const values = [];
      activeDefs.forEach((def) => {
        rows.forEach((row) => {
          const value = def.value(row.timeline);
          if (value !== null) {
            values.push(value);
          }
        });
      });
      const hasData = values.length > 0;
      els.sleepMetricEmpty.classList.toggle("is-visible", !hasData);
      if (!hasData) {
        drawEmptyAxes(ctx, width, height, rows);
        return;
      }

      const lineColor = cssVar("--line");
      const mutedColor = cssVar("--muted");
      const pad = { top: 20, right: 18, bottom: 36, left: 44 };
      const plotWidth = width - pad.left - pad.right;
      const plotHeight = height - pad.top - pad.bottom;
      let minValue = Math.floor((Math.min(...values) - 45) / 60) * 60;
      let maxValue = Math.ceil((Math.max(...values) + 45) / 60) * 60;
      if (maxValue - minValue < 240) {
        const center = (minValue + maxValue) / 2;
        minValue = Math.floor((center - 120) / 60) * 60;
        maxValue = Math.ceil((center + 120) / 60) * 60;
      }
      const xFor = (index) => pad.left + (plotWidth * index) / 6;
      const yFor = (value) => pad.top + plotHeight - ((value - minValue) / (maxValue - minValue)) * plotHeight;

      drawTimeGrid(ctx, width, height, pad, minValue, maxValue, yFor, lineColor, mutedColor);
      drawDateAxis(ctx, rows, height, pad, xFor, mutedColor);

      activeDefs.forEach((def) => {
        drawMetricLine(ctx, rows, def, xFor, yFor, els.metricLabelsToggle.checked);
      });
    }

    function drawSleepTotalBars(ctx, width, height, rows) {
      const values = rows.map((row) => row.timeline?.totalMinutes ?? null);
      const hasData = values.some((value) => value !== null);
      els.sleepMetricEmpty.classList.toggle("is-visible", !hasData);
      if (!hasData) {
        drawEmptyAxes(ctx, width, height, rows);
        return;
      }

      const lineColor = cssVar("--line");
      const mutedColor = cssVar("--muted");
      const accentColor = cssVar("--sleep-main");
      const pad = { top: 20, right: 18, bottom: 36, left: 38 };
      const plotWidth = width - pad.left - pad.right;
      const plotHeight = height - pad.top - pad.bottom;
      const maxHours = Math.max(1, Math.ceil(Math.max(...values.filter((value) => value !== null)) / 60));
      const xFor = (index) => pad.left + (plotWidth * index) / 6;
      const yFor = (hours) => pad.top + plotHeight - (hours / maxHours) * plotHeight;

      ctx.font = "12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.lineWidth = 1;
      ctx.strokeStyle = lineColor;
      ctx.fillStyle = mutedColor;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let tick = 0; tick <= maxHours; tick += Math.max(1, Math.ceil(maxHours / 4))) {
        const y = crisp(yFor(tick));
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
        ctx.fillText(`${tick}h`, pad.left - 6, y);
      }

      drawDateAxis(ctx, rows, height, pad, xFor, mutedColor);

      const barWidth = Math.max(12, Math.min(28, plotWidth / 12));
      values.forEach((value, index) => {
        if (value === null) {
          return;
        }
        const x = xFor(index) - barWidth / 2;
        const y = yFor(value / 60);
        ctx.fillStyle = accentColor;
        ctx.fillRect(x, y, barWidth, height - pad.bottom - y);
        if (els.metricLabelsToggle.checked) {
          ctx.fillStyle = mutedColor;
          ctx.font = "11px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "bottom";
          ctx.fillText(formatDuration(value), x + barWidth / 2, y - 5);
        }
      });
    }

    function drawSegment(ctx, start, end, xFor, y, height, color) {
      if (start === null || end === null || end <= start) {
        return;
      }
      const x = xFor(start);
      const width = Math.max(2, xFor(end) - x);
      ctx.fillStyle = color;
      ctx.fillRect(x, y - height / 2, width, height);
    }

    function drawTimelineLabels(ctx, timeline, xFor, y) {
      if (!timeline || timeline.sleep === null || timeline.wake === null) {
        return;
      }
      const sleepX = xFor(timeline.sleep);
      const wakeX = xFor(timeline.wake);
      const centerX = (sleepX + wakeX) / 2;
      const label = `${formatClock(timeline.sleep)} - ${formatClock(timeline.wake)}`;
      ctx.save();
      ctx.font = "11px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillStyle = cssVar("--muted");
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";
      ctx.fillText(label, centerX, y - 10);

      if (timeline.bed !== null && timeline.bed !== timeline.sleep) {
        ctx.textAlign = "left";
        ctx.fillText(formatClock(timeline.bed), xFor(timeline.bed), y - 10);
      }
      if (timeline.rise !== null && timeline.rise !== timeline.wake) {
        ctx.textAlign = "right";
        ctx.fillText(formatClock(timeline.rise), xFor(timeline.rise), y - 10);
      }
      ctx.restore();
    }

    function drawMetricLine(ctx, rows, def, xFor, yFor, showLabels) {
      ctx.strokeStyle = def.color;
      ctx.fillStyle = def.color;
      ctx.lineWidth = 2.3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      let drawing = false;
      rows.forEach((row, index) => {
        const value = def.value(row.timeline);
        if (value === null) {
          if (drawing) {
            ctx.stroke();
          }
          drawing = false;
          return;
        }
        const x = xFor(index);
        const y = yFor(value);
        if (!drawing) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          drawing = true;
        } else {
          ctx.lineTo(x, y);
        }
      });
      if (drawing) {
        ctx.stroke();
      }
      rows.forEach((row, index) => {
        const value = def.value(row.timeline);
        if (value === null) {
          return;
        }
        ctx.beginPath();
        ctx.arc(xFor(index), yFor(value), 4, 0, Math.PI * 2);
        ctx.fill();
        if (showLabels) {
          drawPointLabel(ctx, formatClock(value), xFor(index), yFor(value), index);
        }
      });
    }

    function drawPointLabel(ctx, label, x, y, index) {
      ctx.save();
      ctx.font = "11px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillStyle = cssVar("--muted");
      ctx.textAlign = index >= 5 ? "right" : "left";
      ctx.textBaseline = "middle";
      const offsetX = index >= 5 ? -7 : 7;
      const offsetY = index % 2 === 0 ? -9 : 9;
      ctx.fillText(label, x + offsetX, y + offsetY);
      ctx.restore();
    }

    function drawTimeGrid(ctx, width, height, pad, minValue, maxValue, yFor, lineColor, mutedColor) {
      const step = maxValue - minValue > 720 ? 180 : 120;
      ctx.font = "12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.lineWidth = 1;
      ctx.strokeStyle = lineColor;
      ctx.fillStyle = mutedColor;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let tick = Math.ceil(minValue / step) * step; tick <= maxValue; tick += step) {
        const y = crisp(yFor(tick));
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(width - pad.right, y);
        ctx.stroke();
        ctx.fillText(formatClock(tick), pad.left - 6, y);
      }
    }

    function drawDateAxis(ctx, rows, height, pad, xFor, mutedColor) {
      ctx.fillStyle = mutedColor;
      ctx.font = "12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      rows.forEach((row, index) => {
        ctx.fillText(row.key.slice(5).replace("-", "/"), xFor(index), height - pad.bottom + 12);
      });
    }

    function drawEmptyAxes(ctx, width, height, rows) {
      const mutedColor = cssVar("--muted");
      ctx.fillStyle = mutedColor;
      ctx.font = "12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      const pad = { left: 40, bottom: 36 };
      const plotWidth = width - 58;
      const xFor = (index) => pad.left + (plotWidth * index) / 6;
      drawDateAxis(ctx, rows, height, pad, xFor, mutedColor);
    }

    function drawLegend(ctx, x, y, color, label) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x + 4, y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = cssVar("--muted");
      ctx.font = "12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.fillText(label, x + 12, y);
    }

    function sleepMetricDefs() {
      return [
        { key: "bed", label: "上床", color: "#9a8171", value: (timeline) => timeline?.bed ?? null },
        { key: "sleep", label: "入睡", color: cssVar("--accent-strong"), value: (timeline) => timeline?.sleep ?? null },
        { key: "wake", label: "醒来", color: cssVar("--good"), value: (timeline) => timeline?.wake ?? null },
        { key: "rise", label: "起床", color: "#9f938b", value: (timeline) => timeline?.rise ?? null }
      ];
    }

    function sleepMetricColor(metric) {
      if (metric === "total") {
        return cssVar("--sleep-main");
      }
      return sleepMetricDefs().find((def) => def.key === metric)?.color || cssVar("--accent-strong");
    }

    function sleepMetricLabel(metric) {
      const labels = {
        bed: "上床时间",
        sleep: "入睡时间",
        wake: "醒来时间",
        rise: "起床时间",
        total: "总睡眠时长"
      };
      return labels[metric] || labels.all;
    }

    function buildSleepTimeline(entry) {
      const rawBed = timeToMinutes(entry.bed);
      const rawSleep = timeToMinutes(entry.sleep);
      const rawWake = timeToMinutes(entry.wake);
      const rawRise = timeToMinutes(entry.rise);
      if ([rawBed, rawSleep, rawWake, rawRise].every((value) => value === null)) {
        return typeof entry.totalOverride === "number"
          ? {
              bed: null,
              sleep: null,
              wake: null,
              rise: null,
              computedTotal: null,
              totalMinutes: entry.totalOverride
            }
          : null;
      }

      const base = rawBed ?? rawSleep ?? rawWake ?? rawRise;
      const bed = rawBed !== null ? rawBed : rawSleep;
      const sleep = rawSleep !== null
        ? normalizeAfter(rawSleep, bed ?? base, true)
        : null;
      const wake = rawWake !== null
        ? normalizeAfter(rawWake, sleep ?? bed ?? base, sleep === null)
        : null;
      const rise = rawRise !== null
        ? normalizeAfter(rawRise, wake ?? sleep ?? bed ?? base, true)
        : wake;
      const computedTotal = sleep !== null && wake !== null && wake > sleep ? wake - sleep : null;

      return {
        bed,
        sleep,
        wake,
        rise,
        computedTotal,
        totalMinutes: effectiveSleepTotal(entry, { totalMinutes: computedTotal })
      };
    }

    function normalizeAfter(value, reference, allowEqual) {
      let result = value;
      while (allowEqual ? result < reference : result <= reference) {
        result += 1440;
      }
      return result;
    }

    function timeToMinutes(value) {
      if (!value) {
        return null;
      }
      const [hours, minutes] = value.split(":").map(Number);
      if (!Number.isFinite(hours) || !Number.isFinite(minutes)) {
        return null;
      }
      return hours * 60 + minutes;
    }

    function effectiveSleepTotal(entry, timeline) {
      return typeof entry.totalOverride === "number"
        ? entry.totalOverride
        : timeline?.totalMinutes ?? null;
    }

    function parseDurationInput(value) {
      const text = String(value || "").trim();
      if (!text) {
        return null;
      }
      const colon = text.match(/^(\d{1,2})[:：](\d{1,2})$/);
      if (colon) {
        const hours = Number(colon[1]);
        const minutes = Number(colon[2]);
        return minutes < 60 ? hours * 60 + minutes : null;
      }
      const hourMinute = text.match(/(?:(\d+(?:\.\d+)?)\s*(?:小时|时|h))?\s*(?:(\d+)\s*(?:分钟|分|m))?/i);
      if (hourMinute && (hourMinute[1] || hourMinute[2])) {
        const hours = hourMinute[1] ? Number(hourMinute[1]) : 0;
        const minutes = hourMinute[2] ? Number(hourMinute[2]) : 0;
        return Math.round(hours * 60 + minutes);
      }
      const decimalHours = Number(text);
      if (Number.isFinite(decimalHours) && decimalHours >= 0) {
        return Math.round(decimalHours * 60);
      }
      return null;
    }

    function formatClock(minutes) {
      const normalized = ((Math.round(minutes) % 1440) + 1440) % 1440;
      const hours = String(Math.floor(normalized / 60)).padStart(2, "0");
      const mins = String(normalized % 60).padStart(2, "0");
      return `${hours}:${mins}`;
    }

    function formatDuration(minutes) {
      const hours = Math.floor(minutes / 60);
      const mins = minutes % 60;
      return mins ? `${hours}小时${mins}分` : `${hours}小时`;
    }

    function crisp(value) {
      return Math.round(value) + 0.5;
    }

    function renderCalendar() {
      const year = monthCursor.getFullYear();
      const month = monthCursor.getMonth();
      const first = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const leading = first.getDay();
      const fragment = document.createDocumentFragment();

      els.monthTitle.textContent = `${year}年${month + 1}月`;
      els.calendarGrid.replaceChildren();

      for (let index = 0; index < leading; index += 1) {
        const blank = document.createElement("div");
        blank.className = "day-blank";
        fragment.append(blank);
      }

      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = new Date(year, month, day);
        const key = dateKey(date);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day-cell";
        button.textContent = day;
        button.setAttribute("aria-label", formatLongDate(key));
        button.classList.toggle("is-today", key === todayKey());
        button.classList.toggle("is-selected", key === selectedHistoryDate);
        button.classList.toggle("has-entry", Boolean(state.entries[key]));
        button.addEventListener("click", () => {
          selectedHistoryDate = key;
          selectedDate = key;
          syncDateInputs(key);
          loadForm(key);
          renderAll();
        });
        fragment.append(button);
      }

      els.calendarGrid.append(fragment);
    }

    function renderDetail() {
      const entry = state.entries[selectedHistoryDate] || {};
      els.detailDate.textContent = formatLongDate(selectedHistoryDate);
      els.detailScore.textContent = typeof entry.score === "number" ? `${entry.score} 分` : "未打分";
      setDetailText(els.detailGood, entry.good);
      setDetailText(els.detailImprove, entry.improve);
      setDetailText(els.detailLucky, entry.lucky);
    }

    function setDetailText(el, text) {
      el.textContent = text || "暂无记录";
      el.classList.toggle("empty-text", !text);
    }

    function normalizeScore(value) {
      if (value === "" || value === null || value === undefined) {
        return null;
      }
      const number = Number(value);
      if (!Number.isFinite(number)) {
        return null;
      }
      return Math.min(100, Math.max(0, Math.round(number)));
    }

    function normalizeDateKey(value) {
      const trimmed = String(value || "").trim();
      const match = trimmed.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (!match) {
        return null;
      }
      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);
      const date = new Date(year, month - 1, day);
      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month - 1 ||
        date.getDate() !== day
      ) {
        return null;
      }
      return dateKey(date);
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return {
          entries: saved.entries || {},
          sleepEntries: saved.sleepEntries || {}
        };
      } catch {
        return { entries: {}, sleepEntries: {} };
      }
    }

    function persistState(options = {}) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (options.sync !== false) {
        scheduleCloudSync();
      }
    }

    function backupPayload() {
      return {
        exportedAt: new Date().toISOString(),
        version: 1,
        entries: state.entries,
        sleepEntries: state.sleepEntries
      };
    }

    function backupText() {
      return JSON.stringify(backupPayload(), null, 2);
    }

    function openBackupModal() {
      refreshBackupText();
      els.backupImportText.value = "";
      els.backupCurrentStatus.textContent = "";
      els.backupPasteStatus.textContent = "粘贴 JSON 后会自动合并。";
      els.backupImportStatus.textContent = "导入会合并到当前数据，已有记录会保留。";
      els.backupModal.classList.add("is-visible");
      els.backupModal.setAttribute("aria-hidden", "false");
    }

    function closeBackupModal() {
      els.backupModal.classList.remove("is-visible");
      els.backupModal.setAttribute("aria-hidden", "true");
    }

    function refreshBackupText() {
      els.backupCurrentText.value = backupText();
    }

    function downloadBackupData() {
      refreshBackupText();
      const payload = {
        text: els.backupCurrentText.value,
        filename: `daily-record-backup-${todayKey()}.json`
      };
      const blob = new Blob([payload.text], {
        type: "application/json"
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = payload.filename;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      els.backupCurrentStatus.textContent = "已下载备份文件。";
      showSaved();
    }

    async function copyBackupData() {
      refreshBackupText();
      const text = els.backupCurrentText.value;
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        els.backupCurrentText.focus();
        els.backupCurrentText.select();
        document.execCommand("copy");
      }
      els.backupCurrentStatus.textContent = "已复制当前数据。";
      showSaved();
    }

    function importPastedBackup() {
      if (!els.backupImportText.value.trim()) {
        return;
      }
      importBackupText(els.backupImportText.value, els.backupPasteStatus);
    }

    function importSelectedBackupFile() {
      const file = els.backupFileInput.files?.[0];
      if (!file) {
        return;
      }
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        importBackupText(String(reader.result || ""), els.backupImportStatus);
        els.backupFileInput.value = "";
      });
      reader.addEventListener("error", () => {
        els.backupImportStatus.textContent = "文件读取失败。";
      });
      reader.readAsText(file);
    }

    function importBackupText(text, statusEl = els.backupImportStatus) {
      let parsed;
      try {
        parsed = JSON.parse(String(text || "").trim());
      } catch {
        statusEl.textContent = "导入失败：JSON 格式不正确。";
        return;
      }

      const result = mergeBackup(parsed);
      if (!result.ok) {
        statusEl.textContent = result.message;
        return;
      }

      persistState();
      loadForm(selectedDate);
      loadSleepForm(selectedSleepDate);
      renderAll();
      refreshBackupText();
      statusEl.textContent = `已合并：新增 ${result.added} 天，补充 ${result.merged} 天。`;
      showSaved();
    }

    function mergeBackup(parsed) {
      const incomingEntries = parsed.entries && typeof parsed.entries === "object" ? parsed.entries : {};
      const incomingSleepEntries = parsed.sleepEntries && typeof parsed.sleepEntries === "object" ? parsed.sleepEntries : {};
      if (!Object.keys(incomingEntries).length && !Object.keys(incomingSleepEntries).length) {
        return { ok: false, message: "导入失败：没有找到可合并的记录。" };
      }

      let added = 0;
      let merged = 0;
      const mergeMap = (target, source) => {
        Object.entries(source).forEach(([key, value]) => {
          if (!normalizeDateKey(key) || !value || typeof value !== "object") {
            return;
          }
          if (target[key]) {
            target[key] = { ...value, ...target[key] };
            merged += 1;
          } else {
            target[key] = value;
            added += 1;
          }
        });
      };

      mergeMap(state.entries, incomingEntries);
      mergeMap(state.sleepEntries, incomingSleepEntries);
      return { ok: true, added, merged };
    }

    function todayKey() {
      return dateKey(new Date());
    }

    function dateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseDateKey(key) {
      const [year, month, day] = key.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function addDays(date, days) {
      const copy = new Date(date);
      copy.setDate(copy.getDate() + days);
      return copy;
    }

    function firstOfMonth(date) {
      return new Date(date.getFullYear(), date.getMonth(), 1);
    }

    function formatLongDate(key) {
      const date = parseDateKey(key);
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "short"
      }).format(date);
    }

    function formatShortDate(key) {
      const date = parseDateKey(key);
      return new Intl.DateTimeFormat("zh-CN", {
        month: "numeric",
        day: "numeric"
      }).format(date);
    }

    function formatCompactDate(key) {
      const date = parseDateKey(key);
      return `${date.getMonth() + 1}.${date.getDate()}`;
    }
  </script>
